<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DHEMS - Update Patient</title>
    <link rel="stylesheet" href="/style.css" />
</head>

<body>
    <header>
        <h1>DHEMS</h1>
        <nav>
            <a href="patient-manager/register.html">Register</a>
            <a class="active" href="patient-manager/update.html">Update</a>
            <a href="patient-manager/display.html">Display</a>
            <a href="patient-manager/next.html">Next Patient</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Update Patient</h2>
            <p class="description">
                Enter a patient ID and replace the patient's information.
            </p>

            <form id="update-form">
                <div class="field">
                    <label for="patient-id">Patient ID</label>
                    <input id="patient-id" type="number" min="1" required />
                </div>

                <hr />

                <div class="form-grid">
                    <div class="field">
                        <label for="name">Name</label>
                        <input id="name" type="text" required />
                    </div>

                    <div class="field">
                        <label for="age">Age</label>
                        <input id="age" type="number" min="0" required />
                    </div>

                    <div class="field">
                        <label for="phone">Phone</label>
                        <input id="phone" type="text" required />
                    </div>

                    <div class="field">
                        <label for="gender">Gender</label>
                        <select id="gender" required>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="address">Address</label>
                        <input id="address" type="text" required />
                    </div>

                    <div class="field">
                        <label for="bloodGroup">Blood Group</label>
                        <input id="bloodGroup" type="text" required />
                    </div>

                    <div class="field">
                        <label for="condition">Condition</label>
                        <input id="condition" type="text" required />
                    </div>

                    <div class="field">
                        <label for="priority">Priority</label>
                        <select id="priority" required>
                            <option value="LOW">Low</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HIGH">High</option>
                            <option value="SEVERE">Severe</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="type">Visit Type</label>
                        <select id="type" required>
                            <option value="APPOINTMENT">Appointment</option>
                            <option value="ADMISSION">Admission</option>
                        </select>
                    </div>
                </div>

                <div class="button-row">
                    <button type="submit">Update Patient</button>
                    <button type="button" class="secondary" id="load-patient">
                        Load Patient
                    </button>
                </div>
            </form>

            <div id="message"></div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
