<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discharge Patient - DHEMS</title>

    <link rel="stylesheet" href="/patient/style.css?v=3">
</head>

<body>

<header class="page-header"><a class="brand" href="/">DHEMS</a><span>Patient services</span></header>

<main>

    <div class="page-title"><p class="eyebrow">PATIENT RECORDS</p><h1>Discharge patient</h1><p>Only patients with appointed status can be discharged.</p></div>
    <section class="panel"><form id="update-form">

        <label>
            Patient ID
            <input type="number" id="patient-id" required>
        </label>

        <button type="submit">Discharge Patient</button>

    </form></section>

    <p id="message"></p>
    <a class="back-link" href="/patient/pm.html">← Patient management</a>

</main>

<script src="/patient/patient.js"></script>

<script>
document
    .getElementById("update-form")
    .addEventListener("submit", async event => {
        event.preventDefault();

        const form = event.target;
        const id = document.getElementById("patient-id").value;

        const result = await PatientAPI.update(id);

        const message = document.getElementById("message");

        if (result.success) {
            message.className = "success";
            message.textContent = "Patient updated.";
        }
        else {
            message.className = "error";
            message.textContent = result.error;
        }
    });
</script>

</body>
</html>
