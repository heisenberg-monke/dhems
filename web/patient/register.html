<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Patient | DHEMS</title>
    <link rel="stylesheet" href="/patient/style.css?v=4">
</head>
<body>
    <header class="page-header"><a class="brand" href="/">DHEMS</a><span>Patient services</span></header>
    <main>
        <div class="page-title">
            <p class="eyebrow">PATIENT RECORDS</p>
            <h1>Register patient</h1>
            <p>Enter the patient details below. New patients begin with admitted status.</p>
        </div>
        <section class="panel">
            <form id="register-form">
                <label for="patient-name">Name</label>
                <input id="patient-name" name="name" type="text" autocomplete="name" required>

                <label for="patient-department">Department</label>
                <select id="patient-department" name="department" required>
                    <option value="0">Ortho</option>
                    <option value="1">Gyno</option>
                    <option value="2">Cardio</option>
                    <option value="3">Neuro</option>
                </select>

                <label class="check" for="patient-emergency">
                    <input id="patient-emergency" type="checkbox" name="emergency">
                    Emergency
                </label>

                <button type="submit">Register patient</button>
            </form>
            <p id="message" role="status" aria-live="polite"></p>
        </section>
        <a class="back-link" href="/patient/pm.html">← Patient management</a>
    </main>
    <script src="/patient/patient.js?v=4"></script>
    <script>
        document.getElementById("register-form").addEventListener("submit", async event => {
            event.preventDefault();
            const form = event.currentTarget;
            const data = new FormData(form);
            const message = document.getElementById("message");
            const patient = {
                name: data.get("name"),
                department: Number(data.get("department")),
                status: 0,
                emergency: data.has("emergency")
            };
            try {
                const result = await PatientAPI.register(patient);
                if (!result.id) throw new Error(result.error || "Registration failed.");
                message.className = "success";
                message.textContent = `Patient registered. ID: ${result.id}`;
                form.reset();
            } catch (error) {
                message.className = "error";
                message.textContent = error.message;
            }
        });
    </script>
</body>
</html>
