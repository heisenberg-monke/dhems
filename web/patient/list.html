<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>All Patients | DHEMS</title><link rel="stylesheet" href="/patient/style.css?v=5"></head>
<body><header class="page-header"><a class="brand" href="/">DHEMS</a><span>Patient services</span></header><main><div class="page-title"><p class="eyebrow">DIRECTORY</p><h1>All patients</h1><p>Patient status and current doctor assignment.</p></div><section class="panel table-panel"><p id="message" role="status">Loading patients…</p><div class="table-scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Status</th><th>Emergency</th><th>Assigned doctor</th></tr></thead><tbody id="patients"></tbody></table></div></section><a class="back-link" href="/patient/pm.html">← Patient management</a></main><script src="/patient/patient.js?v=5"></script><script>
const names = ["Orthopedics", "Gynecology", "Cardiology", "Neurology"]; const statuses = ["Admitted", "Appointed", "Discharged"]; const body = document.getElementById("patients"); const message = document.getElementById("message");
PatientAPI.list().then(items => { if (!items.length) { message.textContent = "No patients have been registered."; return; } message.textContent = ""; for (const p of items) { const row = document.createElement("tr"); for (const value of [p.id, p.name, names[p.department] ?? "Unknown", statuses[p.status] ?? "Unknown", p.emergency ? "Yes" : "No", p.doctorName || "Unassigned"]) { const cell = document.createElement("td"); cell.textContent = value; row.appendChild(cell); } body.appendChild(row); } }).catch(error => { message.className = "error"; message.textContent = error.message; });
</script></body></html>
