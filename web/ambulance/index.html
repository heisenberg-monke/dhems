<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ambulance Navigation | DHEMS</title>
    <link rel="stylesheet" href="/ambulance/style.css">
</head>
<body>
    <header><a href="/">DHEMS</a><span>Emergency response</span></header>
    <main>
        <div class="intro"><p class="eyebrow">AMBULANCE DISPATCH</p><h1>Find a route</h1><p>This interactive schematic city map is a sample road network. Select a marked location to route an ambulance from DHEMS General Hospital.</p></div>
        <section class="dispatch panel">
            <label for="destination">Destination</label>
            <select id="destination"><option value="">Choose a location</option></select>
            <button id="call" disabled>Call ambulance</button>
            <p id="message" role="status">Loading city map…</p>
        </section>
        <section class="map-panel panel" aria-label="Schematic city road map">
            <svg id="map" viewBox="0 0 1000 800" role="img" aria-label="City road map. Click a location to select it."></svg>
            <div class="legend"><span><i class="hospital-key"></i>Hospital</span><span><i class="destination-key"></i>Destination</span><span><i class="route-key"></i>Ambulance route</span></div>
        </section>
        <section class="panel route-panel" id="route-panel" hidden>
            <h2>Route details</h2><p id="route-summary"></p><ol id="route-steps"></ol>
        </section>
        <a class="back" href="/">← DHEMS home</a>
        <p id="map-seed" class="map-seed">Seed: —</p>
    </main>
    <script src="/ambulance/ambulance.js"></script>
</body>
</html>
