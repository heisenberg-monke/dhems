<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHEMS - Patient Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
<header>
    <div class="header-content">
        <h1>DHEMS</h1>
        <p>Patient Manager test interface</p>
    </div>
</header>

<main>
    <section class="card">
        <h2>Register Patient</h2>

        <form id="patient-form">
            <div class="form-grid">
                <div class="field">
                    <label for="name">Name</label>
                    <input id="name" type="text" required>
                </div>

                <div class="field">
                    <label for="age">Age</label>
                    <input id="age" type="number" min="0" required>
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input id="phone" type="text" required>
                </div>

                <div class="field">
                    <label for="gender">Gender</label>
                    <select id="gender" required>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                    </select>
                </div>

                <div class="field full">
                    <label for="address">Address</label>
                    <input id="address" type="text" required>
                </div>

                <div class="field">
                    <label for="bloodGroup">Blood Group</label>
                    <input id="bloodGroup" type="text" placeholder="e.g. O+" required>
                </div>

                <div class="field">
                    <label for="condition">Condition</label>
                    <input id="condition" type="text" required>
                </div>

                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority" required>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="SEVERE">Severe</option>
                    </select>
                </div>

                <div class="field">
                    <label for="type">Visit Type</label>
                    <select id="type" required>
                        <option value="APPOINTMENT">Appointment</option>
                        <option value="ADMISSION">Admission</option>
                    </select>
                </div>
            </div>

            <div class="actions">
                <button type="submit">Register Patient</button>
                <button type="button" class="secondary" id="clear-form">
                    Clear
                </button>
            </div>
        </form>

        <p id="result" class="status"></p>
    </section>

    <section class="card">
        <h2>Patient Manager</h2>

        <div class="actions">
            <button type="button" id="refresh">Refresh Patients</button>
            <button type="button" class="secondary" id="next-appointment">
                Next Appointment
            </button>
            <button type="button" class="secondary" id="next-admission">
                Next Admission
            </button>
        </div>

        <div id="patients" style="margin-top: 20px;">
            <p>No patients loaded.</p>
        </div>

        <h3>Last Response</h3>
        <pre id="debug">Waiting for a request...</pre>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
